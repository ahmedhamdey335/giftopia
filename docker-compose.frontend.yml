services:
  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci || npm install; npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      API_INTERNAL_URL: http://nginx/api
    depends_on:
      - nginx
    networks:
      - giftopia

volumes:
  frontend_node_modules:
